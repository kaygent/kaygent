name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Windows and Linux x64 binaries
        run: npm run build:binaries

      - name: Smoke-test the Linux binary
        run: ./release/Kaygent-linux-x64 --selftest

      - name: Verify the Windows binary
        run: file release/Kaygent.exe

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaygent-binaries
          path: |
            release/Kaygent.exe
            release/Kaygent-linux-x64
            release/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Kaygent.exe
            release/Kaygent-linux-x64
            release/SHA256SUMS.txt
          generate_release_notes: true
